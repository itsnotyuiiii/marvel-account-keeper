name: Release

# Build the desktop app for Windows, macOS and Linux whenever a version tag
# (e.g. v1.0.0) is pushed, then attach the binaries to a GitHub Release.
# Can also be run by hand from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; the release job widens to contents: write below.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/MarvelRivalsAccountTracker.exe
            asset: MarvelRivalsAccountTracker-windows.exe
          - os: macos-latest
            built: dist/MarvelRivalsAccountTracker
            asset: MarvelRivalsAccountTracker-macos
          - os: ubuntu-latest
            built: dist/MarvelRivalsAccountTracker
            asset: MarvelRivalsAccountTracker-linux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build never pushes; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build executable
        run: python build.py

      - name: Stage artifact + checksum
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
          # Generate a SHA256 sidecar so the self-updater (>=v1.7.0) can
          # verify the download. Single bare hex line, no filename suffix
          # — the in-app verifier handles either format.
          python -c "import hashlib, pathlib; p = pathlib.Path('out/${{ matrix.asset }}'); pathlib.Path(str(p) + '.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '\n', encoding='utf-8')"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish for real tag pushes — a manual run just builds + uploads
    # artifacts to the workflow run.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, never interpolated into the script body, so a
          # crafted tag name can't inject shell commands.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Idempotent: create on first run; if the release already exists for
          # this tag, just (re)upload the assets, replacing any of the same name.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber artifacts/*
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              artifacts/*
          fi
