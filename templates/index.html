<!doctype html>
<html lang="en" data-view="cards" data-density="regular">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Marvel Rivals · Account Tracker</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}" />

  <!-- Web fonts are a progressive enhancement: with no internet the app falls
       back to system fonts and stays fully functional. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Familjen+Grotesk:wght@500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel are vendored locally (static/vendor/) so the app works
       fully offline — nothing is fetched from a CDN at runtime. -->
  <script src="{{ url_for('static', filename='vendor/react.production.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/react-dom.production.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/babel.min.js') }}"></script>

  <script src="{{ url_for('static', filename='data.js') }}"></script>
  <script type="text/babel" src="{{ url_for('static', filename='tweaks-panel.jsx') }}"></script>
  <script type="text/babel" src="{{ url_for('static', filename='card-variants.jsx') }}"></script>
  <script type="text/babel" src="{{ url_for('static', filename='match-history.jsx') }}"></script>
  <script type="text/babel" src="{{ url_for('static', filename='app.jsx') }}"></script>

  <!-- Guided-tour caption overlay — dormant unless the URL has ?demo. -->
  <script src="{{ url_for('static', filename='demo-tour.js') }}"></script>
</body>
</html>
